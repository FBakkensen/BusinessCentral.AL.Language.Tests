name: AL Runner discrepancy
description: BusinessCentral.AL.Runner behaves differently from BC Cloud for a feature that has a test here
labels: ["runner-gap"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template when a test in this repo passes on BC Cloud but fails (or behaves differently) on the AL Runner.
        The test here is the ground truth — document the gap so the runner can be fixed.

  - type: input
    id: test_file
    attributes:
      label: Test file / procedure
      description: "Example: `tests/al-language/record/TestRecordCopy.al · Record_Copy_WithFilter_CopiesMatchingRows`"
      placeholder: "path/to/TestFile.al · Procedure_Name"
    validations:
      required: true

  - type: textarea
    id: cloud_behavior
    attributes:
      label: Correct BC Cloud behavior (what the test asserts)
      description: What does the test verify? What value or outcome is expected?
    validations:
      required: true

  - type: textarea
    id: runner_behavior
    attributes:
      label: AL Runner behavior (what it actually does)
      description: What does the runner return or throw instead?
    validations:
      required: true

  - type: input
    id: runner_version
    attributes:
      label: AL Runner version
      placeholder: "e.g. 0.9.3"
    validations:
      required: false

  - type: input
    id: runner_issue
    attributes:
      label: Linked runner issue (if any)
      description: Link to the issue in BusinessCentral.AL.Runner if one exists
      placeholder: "https://github.com/StefanMaron/BusinessCentral.AL.Runner/issues/..."
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
